name: CI

# Builds and publishes:
#   - Container image at ghcr.io/soctalk/soctalk-tenant-forwarder
#     tagged `latest` + short SHA (+ release version on `v*` tags).
#
# Triggered on:
#   - push to main         → syntax check + publishes image
#   - push of a `v*` tag   → adds the release version as an image tag
#   - workflow_dispatch    → manual button
#   - pull_request         → runs checks only (no publish)
#
# A chart-publish job will be added once chart/Chart.yaml + templates
# are populated.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag. Always also tagged `latest` and short SHA."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Syntax check
        run: python -m compileall -q app/

  build-image:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          image="ghcr.io/soctalk/soctalk-tenant-forwarder"
          short_sha="${GITHUB_SHA::7}"
          tags=("$image:latest" "$image:$short_sha")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/v}"
            tags+=("$image:$ver")
          fi
          if [[ -n "${{ inputs.tag }}" ]]; then
            tags+=("$image:${{ inputs.tag }}")
          fi
          printf '%s\n' "${tags[@]}"
          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=soctalk-tenant-forwarder
          cache-to: type=gha,scope=soctalk-tenant-forwarder,mode=max
          provenance: false
